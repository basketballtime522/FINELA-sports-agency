<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#060709">
  <title>404 | FINELA SPORTS AGENCY</title>
  <link rel="icon" type="image/png" href="/finela-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: #060709;
      color: #e6e8ef;
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      background-image: radial-gradient(circle at 50% 35%, rgba(230, 0, 18, 0.18), transparent 55%);
    }
    .box { max-width: 560px; }
    .logo { width: 150px; height: auto; margin-bottom: 28px; }
    .code {
      font-family: Oswald, Impact, sans-serif;
      font-size: clamp(5rem, 22vw, 9rem);
      font-weight: 700;
      line-height: 1;
      color: #e60012;
      text-shadow: 0 0 40px rgba(230, 0, 18, 0.55);
    }
    h1 { font-size: 1.4rem; font-weight: 800; margin: 18px 0 10px; color: #fff; }
    p { color: #9aa0b2; line-height: 1.7; word-break: keep-all; }
    .btn {
      display: inline-block;
      margin-top: 30px;
      padding: 14px 34px;
      border-radius: 40px;
      background: #e60012;
      color: #fff;
      font-weight: 700;
      letter-spacing: 1px;
      text-decoration: none;
      box-shadow: 0 0 25px rgba(230, 0, 18, 0.5);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 0 38px rgba(230, 0, 18, 0.8); }
  </style>
</head>
<body>
  <main class="box">
    <img class="logo" src="/finela-logo.png" alt="FINELA">
    <div class="code">404</div>
    <h1>페이지를 찾을 수 없습니다</h1>
    <p>주소가 잘못되었거나 이동·삭제된 페이지입니다.<br>FINELA 홈에서 선수단과 서비스를 만나보세요.</p>
    <a class="btn" href="/">HOME으로 돌아가기</a>
  </main>
</body>
</html>
