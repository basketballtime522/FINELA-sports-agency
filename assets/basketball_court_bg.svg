<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <!--
    FIBA 공식 규격 농구 코트 (28m x 15m) - 백보드/림 제외, 코트 라인 전용
    - 내부 좌표 단위: cm (코트 0~2800 x 0~1500)
    - 캔버스 배치: 높이 920px (y 80~1000), 폭 1717.333px (x 101.333~1818.667), 비율 28:15 유지
      → transform: translate(101.333 80) scale(0.613333)
    - 주요 치수
      · 센터 서클 반지름 1.8m
      · 제한구역(페인트) 5.8m x 4.9m
      · 자유투 서클 반지름 1.8m (자유투 라인 중심)
      · 골대 중심: 엔드라인에서 1.575m
      · 3점 라인: 골대 중심에서 6.75m, 사이드라인에서 0.9m 떨어진 평행 직선
      · 노차지 반원: 골대 중심에서 1.25m, 0.375m 직선 연결
    - 선 스타일: 모든 선 동일 굵기·동일 색상(불투명 단색)
      투명도는 그룹 전체에 1회만 적용 → 선이 겹치는 곳도 더 밝거나 굵어 보이지 않음
  -->
  <g transform="translate(101.333 80) scale(0.613333)">

    <!-- 바닥 면 채움 (선과 분리된 레이어) -->
    <g fill="#e60012" opacity="0.035" stroke="none">
      <rect x="0" y="505" width="580" height="490" />
      <rect x="2220" y="505" width="580" height="490" />
    </g>

    <!-- 코트 라인: 단일 색상 / 단일 굵기 / 그룹 단위 투명도 -->
    <g fill="none" stroke="#e60012" stroke-width="4.6" stroke-linecap="butt" stroke-linejoin="miter" opacity="0.5">

      <!-- 외곽 라인 (사이드라인 / 엔드라인) -->
      <rect x="0" y="0" width="2800" height="1500" />

      <!-- 센터 라인 -->
      <line x1="1400" y1="0" x2="1400" y2="1500" />

      <!-- 센터 서클 (r = 1.8m) -->
      <circle cx="1400" cy="750" r="180" />

      <!-- ===================== 좌측 하프 ===================== -->
      <!-- 제한구역 (5.8m x 4.9m) - 엔드라인과 겹치는 변은 그리지 않음 -->
      <path d="M 0 505 L 580 505 L 580 995 L 0 995" />
      <!-- 자유투 서클: 바깥쪽 실선 / 안쪽 점선 -->
      <path d="M 580 570 A 180 180 0 0 1 580 930" />
      <path d="M 580 930 A 180 180 0 0 1 580 570" stroke-dasharray="14 14" />
      <!-- 3점 라인 (r = 6.75m, 코너 0.9m) -->
      <path d="M 0 90 L 299 90 A 675 675 0 0 1 299 1410 L 0 1410" />
      <!-- 노차지 반원 (r = 1.25m) -->
      <path d="M 120 625 L 157.5 625 A 125 125 0 0 1 157.5 875 L 120 875" />
      <!-- 리바운드 위치 표시 (제한구역 바깥쪽 10cm) -->
      <path d="M 175 495 V 505 M 225 495 V 505 M 310 495 V 505 M 395 495 V 505
               M 175 995 V 1005 M 225 995 V 1005 M 310 995 V 1005 M 395 995 V 1005" />

      <!-- ===================== 우측 하프 (좌우 대칭) ===================== -->
      <path d="M 2800 505 L 2220 505 L 2220 995 L 2800 995" />
      <path d="M 2220 930 A 180 180 0 0 1 2220 570" />
      <path d="M 2220 570 A 180 180 0 0 1 2220 930" stroke-dasharray="14 14" />
      <path d="M 2800 90 L 2501 90 A 675 675 0 0 0 2501 1410 L 2800 1410" />
      <path d="M 2680 625 L 2642.5 625 A 125 125 0 0 0 2642.5 875 L 2680 875" />
      <path d="M 2625 495 V 505 M 2575 495 V 505 M 2490 495 V 505 M 2405 495 V 505
               M 2625 995 V 1005 M 2575 995 V 1005 M 2490 995 V 1005 M 2405 995 V 1005" />
    </g>
  </g>
</svg>
