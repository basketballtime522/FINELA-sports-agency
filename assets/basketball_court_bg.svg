<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- 은은한 붉은색 글로우 필터 -->
    <filter id="courtRedGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="courtFadeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e60012" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#e60012" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#e60012" stop-opacity="0.35" />
    </linearGradient>
  </defs>

  <g stroke="rgba(230, 0, 18, 0.42)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- 외곽 코트 라인 -->
    <rect x="70" y="70" width="1780" height="940" rx="6" stroke="rgba(230, 0, 18, 0.55)" stroke-width="3" />

    <!-- 센터 라인 -->
    <line x1="960" y1="70" x2="960" y2="1010" stroke="rgba(230, 0, 18, 0.5)" stroke-width="2.8" />

    <!-- 센터 서클 (외측 & 내측) -->
    <circle cx="960" cy="540" r="135" stroke="rgba(230, 0, 18, 0.55)" stroke-width="2.8" fill="rgba(230, 0, 18, 0.015)" />
    <circle cx="960" cy="540" r="40" stroke="rgba(230, 0, 18, 0.45)" stroke-width="2" />

    <!-- 좌측 페인트(키) 존 -->
    <rect x="70" y="370" width="410" height="340" fill="rgba(230, 0, 18, 0.035)" stroke="rgba(230, 0, 18, 0.5)" stroke-width="2.5" />
    <!-- 좌측 자유투 서클 -->
    <path d="M 480 370 A 170 170 0 0 1 480 710" stroke="rgba(230, 0, 18, 0.5)" stroke-width="2.5" />
    <path d="M 480 710 A 170 170 0 0 1 480 370" stroke="rgba(230, 0, 18, 0.35)" stroke-width="2" stroke-dasharray="8 8" />

    <!-- 좌측 3점 슛 라인 -->
    <path d="M 70 160 L 260 160 A 480 480 0 0 1 260 920 L 70 920" stroke="rgba(230, 0, 18, 0.52)" stroke-width="2.8" />

    <!-- 좌측 백보드 및 림 -->
    <line x1="160" y1="465" x2="160" y2="615" stroke="rgba(255, 255, 255, 0.65)" stroke-width="4.5" />
    <line x1="160" y1="540" x2="185" y2="540" stroke="rgba(230, 0, 18, 0.6)" stroke-width="2.5" />
    <circle cx="210" cy="540" r="25" stroke="#e60012" stroke-width="3" fill="rgba(230, 0, 18, 0.08)" />
    <!-- 좌측 노차지 세미서클 -->
    <path d="M 160 485 A 55 55 0 0 1 160 595" stroke="rgba(230, 0, 18, 0.4)" stroke-width="2" />

    <!-- 좌측 페인트 존 레인 마크 -->
    <line x1="210" y1="360" x2="210" y2="370" stroke="rgba(230, 0, 18, 0.5)" stroke-width="2" />
    <line x1="270" y1="360" x2="270" y2="370" stroke="rgba(230, 0, 18, 0.5)" stroke-width="2" />
    <line x1="330" y1="360" x2="330" y2="370" stroke="rgba(230, 0, 18, 0.5)" stroke-width="2" />
    <line x1="210" y1="710" x2="210" y2="720" stroke="rgba(230, 0, 18, 0.5)" stroke-width="2" />
    <line x1="270" y1="710" x2="270" y2="720" stroke="rgba(230, 0, 18, 0.5)" stroke-width="2" />
    <line x1="330" y1="710" x2="330" y2="720" stroke="rgba(230, 0, 18, 0.5)" stroke-width="2" />

    <!-- 우측 페인트(키) 존 -->
    <rect x="1440" y="370" width="410" height="340" fill="rgba(230, 0, 18, 0.035)" stroke="rgba(230, 0, 18, 0.5)" stroke-width="2.5" />
    <!-- 우측 자유투 서클 -->
    <path d="M 1440 710 A 170 170 0 0 1 1440 370" stroke="rgba(230, 0, 18, 0.5)" stroke-width="2.5" />
    <path d="M 1440 370 A 170 170 0 0 1 1440 710" stroke="rgba(230, 0, 18, 0.35)" stroke-width="2" stroke-dasharray="8 8" />

    <!-- 우측 3점 슛 라인 -->
    <path d="M 1850 160 L 1660 160 A 480 480 0 0 0 1660 920 L 1850 920" stroke="rgba(230, 0, 18, 0.52)" stroke-width="2.8" />

    <!-- 우측 백보드 및 림 -->
    <line x1="1760" y1="465" x2="1760" y2="615" stroke="rgba(255, 255, 255, 0.65)" stroke-width="4.5" />
    <line x1="1760" y1="540" x2="1735" y2="540" stroke="rgba(230, 0, 18, 0.6)" stroke-width="2.5" />
    <circle cx="1710" cy="540" r="25" stroke="#e60012" stroke-width="3" fill="rgba(230, 0, 18, 0.08)" />
    <!-- 우측 노차지 세미서클 -->
    <path d="M 1760 485 A 55 55 0 0 0 1760 595" stroke="rgba(230, 0, 18, 0.4)" stroke-width="2" />

    <!-- 우측 페인트 존 레인 마크 -->
    <line x1="1710" y1="360" x2="1710" y2="370" stroke="rgba(230, 0, 18, 0.5)" stroke-width="2" />
    <line x1="1650" y1="360" x2="1650" y2="370" stroke="rgba(230, 0, 18, 0.5)" stroke-width="2" />
    <line x1="1590" y1="360" x2="1590" y2="370" stroke="rgba(230, 0, 18, 0.5)" stroke-width="2" />
    <line x1="1710" y1="710" x2="1710" y2="720" stroke="rgba(230, 0, 18, 0.5)" stroke-width="2" />
    <line x1="1650" y1="710" x2="1650" y2="720" stroke="rgba(230, 0, 18, 0.5)" stroke-width="2" />
    <line x1="1590" y1="710" x2="1590" y2="720" stroke="rgba(230, 0, 18, 0.5)" stroke-width="2" />
  </g>
</svg>
