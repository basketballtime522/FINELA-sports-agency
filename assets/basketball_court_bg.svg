<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <filter id="courtRedGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 백보드 및 골대(림) 완전 삭제 / 농구 코트 라인 전용 그래픽 -->
  <g stroke="rgba(230, 0, 18, 0.44)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- 외곽 코트 라인 (상하좌우 여유 확보: y=80 ~ 1000) -->
    <rect x="80" y="80" width="1760" height="920" rx="6" stroke="rgba(230, 0, 18, 0.55)" stroke-width="3" />

    <!-- 센터 라인 -->
    <line x1="960" y1="80" x2="960" y2="1000" stroke="rgba(230, 0, 18, 0.5)" stroke-width="2.8" />

    <!-- 센터 서클 (외측 & 내측) -->
    <circle cx="960" cy="540" r="135" stroke="rgba(230, 0, 18, 0.55)" stroke-width="2.8" fill="rgba(230, 0, 18, 0.015)" />
    <circle cx="960" cy="540" r="40" stroke="rgba(230, 0, 18, 0.45)" stroke-width="2" />

    <!-- 좌측 페인트(키) 존 -->
    <rect x="80" y="370" width="410" height="340" fill="rgba(230, 0, 18, 0.035)" stroke="rgba(230, 0, 18, 0.5)" stroke-width="2.5" />
    <!-- 좌측 자유투 서클 -->
    <path d="M 490 370 A 170 170 0 0 1 490 710" stroke="rgba(230, 0, 18, 0.5)" stroke-width="2.5" />
    <path d="M 490 710 A 170 170 0 0 1 490 370" stroke="rgba(230, 0, 18, 0.35)" stroke-width="2" stroke-dasharray="8 8" />

    <!-- 좌측 3점 슛 라인 -->
    <path d="M 80 170 L 260 170 A 470 470 0 0 1 260 910 L 80 910" stroke="rgba(230, 0, 18, 0.52)" stroke-width="2.8" />

    <!-- 좌측 페인트 존 레인 마크 -->
    <line x1="220" y1="360" x2="220" y2="370" stroke="rgba(230, 0, 18, 0.5)" stroke-width="2" />
    <line x1="280" y1="360" x2="280" y2="370" stroke="rgba(230, 0, 18, 0.5)" stroke-width="2" />
    <line x1="340" y1="360" x2="340" y2="370" stroke="rgba(230, 0, 18, 0.5)" stroke-width="2" />
    <line x1="220" y1="710" x2="220" y2="720" stroke="rgba(230, 0, 18, 0.5)" stroke-width="2" />
    <line x1="280" y1="710" x2="280" y2="720" stroke="rgba(230, 0, 18, 0.5)" stroke-width="2" />
    <line x1="340" y1="710" x2="340" y2="720" stroke="rgba(230, 0, 18, 0.5)" stroke-width="2" />

    <!-- 우측 페인트(키) 존 -->
    <rect x="1430" y="370" width="410" height="340" fill="rgba(230, 0, 18, 0.035)" stroke="rgba(230, 0, 18, 0.5)" stroke-width="2.5" />
    <!-- 우측 자유투 서클 -->
    <path d="M 1430 710 A 170 170 0 0 1 1430 370" stroke="rgba(230, 0, 18, 0.5)" stroke-width="2.5" />
    <path d="M 1430 370 A 170 170 0 0 1 1430 710" stroke="rgba(230, 0, 18, 0.35)" stroke-width="2" stroke-dasharray="8 8" />

    <!-- 우측 3점 슛 라인 -->
    <path d="M 1840 170 L 1660 170 A 470 470 0 0 0 1660 910 L 1840 910" stroke="rgba(230, 0, 18, 0.52)" stroke-width="2.8" />

    <!-- 우측 페인트 존 레인 마크 -->
    <line x1="1700" y1="360" x2="1700" y2="370" stroke="rgba(230, 0, 18, 0.5)" stroke-width="2" />
    <line x1="1640" y1="360" x2="1640" y2="370" stroke="rgba(230, 0, 18, 0.5)" stroke-width="2" />
    <line x1="1580" y1="360" x2="1580" y2="370" stroke="rgba(230, 0, 18, 0.5)" stroke-width="2" />
    <line x1="1700" y1="710" x2="1700" y2="720" stroke="rgba(230, 0, 18, 0.5)" stroke-width="2" />
    <line x1="1640" y1="710" x2="1640" y2="720" stroke="rgba(230, 0, 18, 0.5)" stroke-width="2" />
    <line x1="1580" y1="710" x2="1580" y2="720" stroke="rgba(230, 0, 18, 0.5)" stroke-width="2" />
  </g>
</svg>
