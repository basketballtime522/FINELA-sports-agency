<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FINELA Store - Premium Agency Merchandise</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 
                        finelaRed: '#e60012', 
                        darkBg: '#0a0a0a', 
                        cardBg: '#141414',
                        cardHover: '#1f1f1f'
                    },
                    fontFamily: { 
                        sans: ['"Noto Sans KR"', 'sans-serif'], 
                        display: ['Oswald', 'sans-serif'] 
                    }
                }
            }
        }
    </script>
    
    <style>
        body { 
            background-color: #0a0a0a; 
            color: white; 
            overflow-y: scroll;
        }
        /* View Transition Animation */
        .view-section {
            display: none;
            animation: fadeIn 0.4s ease-out forwards;
        }
        .view-section.active {
            display: block;
        }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #e60012; }

        /* Size Button Active State */
        .size-btn.active {
            border-color: #e60012;
            color: #e60012;
            background-color: rgba(230, 0, 18, 0.1);
        }
    </style>
</head>
<body class="min-h-screen p-6 md:p-12 lg:p-20 font-sans antialiased flex flex-col items-center">

    <!-- ==========================================
         VIEW 1: SHOP GRID (MAIN)
         ========================================== -->
    <div id="shop-view" class="view-section active w-full max-w-7xl">
        
        <!-- Header -->
        <div class="flex flex-col items-center md:items-start border-b border-gray-800 pb-8 mb-12">
            <h1 class="text-finelaRed font-display text-5xl md:text-6xl font-bold tracking-wider mb-3 uppercase">FINELA Store</h1>
            <p class="text-gray-400 text-lg md:text-xl">Official Agency & Player Merchandise</p>
        </div>

        <!-- Product Grid Container (Populated by JS) -->
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 xl:gap-12">
            <!-- Products will be injected here via JavaScript -->
        </div>
    </div>

    <!-- ==========================================
         VIEW 2: PRODUCT DETAIL
         ========================================== -->
    <div id="detail-view" class="view-section w-full max-w-6xl">
        
        <!-- Back Button -->
        <button onclick="showShopView()" class="group flex items-center text-gray-400 hover:text-white transition-colors mb-10 text-sm font-bold tracking-widest uppercase">
            <i class="fa-solid fa-arrow-left mr-3 group-hover:-translate-x-1 transition-transform"></i> Back to Shop
        </button>

        <div class="flex flex-col md:flex-row gap-10 lg:gap-16">
            
            <!-- Product Image Left -->
            <div class="w-full md:w-1/2">
                <div class="aspect-square bg-cardBg border border-gray-800 rounded-2xl flex items-center justify-center overflow-hidden relative shadow-2xl">
                    <img id="detail-image" src="" alt="Product" class="w-full h-full object-cover opacity-80" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <div id="detail-placeholder-icon" class="absolute inset-0 flex-col items-center justify-center text-gray-700 hidden">
                        <i class="fa-solid fa-box text-6xl mb-4"></i>
                        <span class="text-sm font-bold tracking-widest">PRODUCT IMAGE</span>
                    </div>
                </div>
            </div>

            <!-- Product Info Right -->
            <div class="w-full md:w-1/2 flex flex-col justify-center">
                <!-- Title & Price -->
                <h2 id="detail-title" class="text-3xl md:text-4xl font-bold mb-4 leading-tight">Product Title</h2>
                <div class="text-finelaRed font-display text-3xl font-bold mb-6 tracking-wide" id="detail-price">₩0</div>
                
                <!-- Divider -->
                <div class="w-full h-px bg-gray-800 mb-6"></div>
                
                <!-- Description -->
                <p id="detail-desc" class="text-gray-400 leading-relaxed mb-8 text-lg">Product description goes here.</p>
                
                <!-- Size Selector (Hidden for non-apparel) -->
                <div id="size-selector-container" class="mb-10">
                    <h3 class="text-sm font-bold text-gray-500 tracking-widest mb-4 uppercase">Select Size</h3>
                    <div class="flex gap-4">
                        <button class="size-btn w-12 h-12 rounded border border-gray-700 flex items-center justify-center font-bold text-gray-300 hover:border-white transition-colors" onclick="selectSize(this)">S</button>
                        <button class="size-btn w-12 h-12 rounded border border-gray-700 flex items-center justify-center font-bold text-gray-300 hover:border-white transition-colors" onclick="selectSize(this)">M</button>
                        <button class="size-btn w-12 h-12 rounded border border-gray-700 flex items-center justify-center font-bold text-gray-300 hover:border-white transition-colors" onclick="selectSize(this)">L</button>
                        <button class="size-btn w-12 h-12 rounded border border-gray-700 flex items-center justify-center font-bold text-gray-300 hover:border-white transition-colors" onclick="selectSize(this)">XL</button>
                    </div>
                </div>

                <!-- Add to Cart Button -->
                <button onclick="addToCart()" class="w-full bg-finelaRed hover:bg-red-700 text-white font-bold py-5 rounded-lg uppercase tracking-widest transition-colors shadow-[0_0_20px_rgba(230,0,18,0.3)] hover:shadow-[0_0_30px_rgba(230,0,18,0.5)] flex items-center justify-center">
                    <i class="fa-solid fa-cart-shopping mr-3"></i> Add To Cart
                </button>
                
                <!-- Extra Info -->
                <div class="mt-6 flex flex-col gap-2 text-sm text-gray-600">
                    <p><i class="fa-solid fa-truck-fast w-5"></i> 국내 전 지역 무료 배송 (5만원 이상 결제 시)</p>
                    <p><i class="fa-solid fa-rotate-left w-5"></i> 7일 이내 단순 변심 환불 가능</p>
                </div>
            </div>
        </div>
    </div>

    <!-- ==========================================
         JAVASCRIPT
         ========================================== -->
    <script>
        // Product Data Array
        const products = [
            {
                id: 1,
                title: "FINELA Official Logo T-shirt",
                price: "39,000",
                description: "FINELA의 시그니처 로고가 가슴에 새겨진 프리미엄 반팔 티셔츠입니다. 최고급 코튼 소재를 사용하여 부드러운 촉감과 뛰어난 내구성을 자랑하며, 일상과 훈련 중 언제나 편안하게 착용할 수 있습니다.",
                hasSize: true,
                image: "https://placehold.co/600x600/141414/333333?text=FINELA+T-SHIRT",
                icon: "fa-shirt"
            },
            {
                id: 2,
                title: "#1 이현중 Replica Jersey",
                price: "89,000",
                description: "국가대표 이현중 선수의 2026 아시안게임 공식 레플리카 져지입니다. 실제 선수들이 착용하는 유니폼과 동일한 흡한속건 기능성 소재가 사용되었으며, 등면에는 등번호 1번과 이름이 마킹되어 있습니다.",
                hasSize: true,
                image: "https://placehold.co/600x600/141414/333333?text=REPLICA+JERSEY",
                icon: "fa-vest"
            },
            {
                id: 3,
                title: "FINELA Signature Basketball",
                price: "65,000",
                description: "FINELA 에이전시 공식 로고와 슬로건 'PLAY WITH THE MEDALISTS'가 각인된 프리미엄 실내외 겸용 농구공입니다. 최상급 합성 가죽으로 제작되어 뛰어난 그립감을 제공합니다.",
                hasSize: false,
                image: "https://placehold.co/600x600/141414/333333?text=BASKETBALL",
                icon: "fa-basketball"
            },
            {
                id: 4,
                title: "FINELA Agency Logo Hoodie",
                price: "75,000",
                description: "편안한 착용감과 도톰한 기모 안감으로 제작된 겨울용 시그니처 후디입니다. 올블랙 바디에 FINELA 레드 컬러의 자수 로고가 포인트로 들어가 있어 스트릿 무드를 연출합니다.",
                hasSize: true,
                image: "https://placehold.co/600x600/141414/333333?text=HOODIE",
                icon: "fa-user-ninja"
            },
            {
                id: 5,
                title: "National Team Cheering Towel",
                price: "15,000",
                description: "소속 선수들을 응원하기 위해 제작된 특별 한정판 슬로건 타월입니다. 강렬한 붉은색 바탕에 흰색 타이포그래피가 새겨져 있어 경기장 직관 시 필수 아이템입니다.",
                hasSize: false,
                image: "https://placehold.co/600x600/141414/333333?text=CHEERING+TOWEL",
                icon: "fa-scroll"
            },
            {
                id: 6,
                title: "Premium Player Photo Card Set",
                price: "25,000",
                description: "FINELA 소속 국가대표 12인의 미공개 훈련 사진 및 프로필 컷이 담긴 프리미엄 포토카드 세트(12장 1세트)입니다. 뒷면에는 각 선수의 친필 싸인(인쇄)과 시즌 각오가 적혀 있습니다.",
                hasSize: false,
                image: "https://placehold.co/600x600/141414/333333?text=PHOTO+CARD+SET",
                icon: "fa-images"
            }
        ];

        // Format Currency
        function formatPrice(priceStr) {
            return "₩" + priceStr;
        }

        // Initialize Shop Grid
        function initShop() {
            const gridContainer = document.getElementById('product-grid');
            gridContainer.innerHTML = '';

            products.forEach(product => {
                const cardHTML = `
                    <div onclick="showDetailView(${product.id})" class="group cursor-pointer flex flex-col bg-cardBg rounded-xl overflow-hidden border border-gray-800 hover:border-finelaRed transition-all duration-300 transform hover:-translate-y-2 shadow-lg hover:shadow-[0_10px_30px_rgba(230,0,18,0.15)]">
                        <!-- Image Area -->
                        <div class="aspect-square bg-gray-900 relative overflow-hidden flex items-center justify-center">
                            <img src="${product.image}" alt="${product.title}" class="w-full h-full object-cover opacity-70 group-hover:opacity-100 group-hover:scale-105 transition-all duration-500">
                            <!-- Fallback Icon if image fails -->
                            <i class="fa-solid ${product.icon} absolute text-5xl text-gray-700 opacity-20 pointer-events-none"></i>
                        </div>
                        
                        <!-- Info Area -->
                        <div class="p-6 flex flex-col flex-grow justify-between">
                            <div>
                                <h3 class="text-xl font-bold text-white mb-2 group-hover:text-finelaRed transition-colors line-clamp-2">${product.title}</h3>
                            </div>
                            <div class="mt-4 flex items-center justify-between">
                                <span class="text-gray-300 font-display text-xl tracking-wide">${formatPrice(product.price)}</span>
                                <span class="w-8 h-8 rounded-full bg-gray-800 flex items-center justify-center group-hover:bg-finelaRed group-hover:text-white text-gray-400 transition-colors">
                                    <i class="fa-solid fa-arrow-right text-xs"></i>
                                </span>
                            </div>
                        </div>
                    </div>
                `;
                gridContainer.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        // Switch to Detail View
        function showDetailView(productId) {
            const product = products.find(p => p.id === productId);
            if(!product) return;

            // Populate Data
            document.getElementById('detail-title').innerText = product.title;
            document.getElementById('detail-price').innerText = formatPrice(product.price);
            document.getElementById('detail-desc').innerText = product.description;
            
            const detailImg = document.getElementById('detail-image');
            detailImg.src = product.image;
            detailImg.style.display = 'block'; // Reset display in case it failed previously
            
            // Handle Size Selector visibility
            const sizeSelector = document.getElementById('size-selector-container');
            if (product.hasSize) {
                sizeSelector.style.display = 'block';
                // Reset size selection
                document.querySelectorAll('.size-btn').forEach(btn => btn.classList.remove('active'));
            } else {
                sizeSelector.style.display = 'none';
            }

            // Scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });

            // Toggle Views
            document.getElementById('shop-view').classList.remove('active');
            document.getElementById('detail-view').classList.add('active');
        }

        // Switch to Shop View
        function showShopView() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
            document.getElementById('detail-view').classList.remove('active');
            document.getElementById('shop-view').classList.add('active');
        }

        // Handle Size Selection
        function selectSize(element) {
            document.querySelectorAll('.size-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
        }

        // Dummy Add to Cart function
        function addToCart() {
            // Check if size is needed and selected
            const sizeSelector = document.getElementById('size-selector-container');
            if (sizeSelector.style.display !== 'none') {
                const selectedSize = document.querySelector('.size-btn.active');
                if (!selectedSize) {
                    alert('옵션(사이즈)을 선택해 주세요.');
                    return;
                }
            }
            
            // Replaced alert with custom UI logic or simple console log due to constraints
            // Simulating a success message inside the button briefly
            const btn = event.currentTarget;
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-check mr-3"></i> Added to Cart!';
            btn.classList.add('bg-green-600', 'shadow-[0_0_20px_rgba(22,163,74,0.4)]');
            btn.classList.remove('bg-finelaRed', 'hover:bg-red-700', 'shadow-[0_0_20px_rgba(230,0,18,0.3)]', 'hover:shadow-[0_0_30px_rgba(230,0,18,0.5)]');
            
            setTimeout(() => {
                btn.innerHTML = originalContent;
                btn.classList.remove('bg-green-600', 'shadow-[0_0_20px_rgba(22,163,74,0.4)]');
                btn.classList.add('bg-finelaRed', 'hover:bg-red-700', 'shadow-[0_0_20px_rgba(230,0,18,0.3)]', 'hover:shadow-[0_0_30px_rgba(230,0,18,0.5)]');
            }, 2000);
        }

        // Run on load
        window.onload = function() {
            initShop();
        };
    </script>
</body>
</html>
